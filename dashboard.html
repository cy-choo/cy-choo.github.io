    /**
     * Fetch weather data from Tomorrow.io, TWC (The Weather Channel) & MET (MET Malaysia)
     */
    async function fetchWeatherFromSources() {
      if (AppState.isFetching) return;
      AppState.isFetching = true;

      fetchWeatherWarnings();

      if (DOM.refreshBtn) DOM.refreshBtn.classList.add('spinning');

      try {
        const locationKeys = Object.keys(LOCATIONS);
        const [tomorrowResults, twcResults, metResults] = await Promise.all([
          Promise.allSettled(locationKeys.map(k => fetchTomorrowLocation(k))),
          Promise.allSettled(locationKeys.map(k => fetchTwcLocation(k))),
          Promise.allSettled(locationKeys.map(k => fetchMetLocation(k)))
        ]);

        let updatedTomorrow = false;
        tomorrowResults.forEach((res, idx) => {
          const k = locationKeys[idx];
          if (res.status === 'fulfilled' && res.value) {
            AppState.tomorrowData[k] = res.value;
            updatedTomorrow = true;
          }
        });

        let updatedTwc = false;
        twcResults.forEach((res, idx) => {
          const k = locationKeys[idx];
          if (res.status === 'fulfilled' && res.value) {
            AppState.twcData[k] = res.value;
            updatedTwc = true;
          }
        });

        let updatedMet = false;
        metResults.forEach((res, idx) => {
          const k = locationKeys[idx];
          if (res.status === 'fulfilled' && res.value) {
            AppState.metData[k] = res.value;
            updatedMet = true;
          }
        });

        if (updatedTomorrow || updatedTwc || updatedMet) {
          showToast(`Updated weather data (${AppState.source})!`, 'success');
        } else {
          showToast(`Loaded latest ${AppState.source} weather snapshot`, 'info');
        }

        AppState.nextSyncTime = Date.now() + AppState.pullIntervalMs;
        renderDashboard();

      } catch (err) {
        console.error("Fetch error:", err);
      } finally {
        AppState.isFetching = false;
        if (DOM.refreshBtn) DOM.refreshBtn.classList.remove('spinning');
        scheduleCountdown();
      }
    }

    /**
     * Switch Weather Source ("TWC" or "MET")
     */
    function switchSource(newSource) {
      const normalized = newSource === 'MET' ? 'MET' : 'TWC';
      if (AppState.source === normalized) return;
      AppState.source = normalized;
      renderDashboard();
      const sourceName = normalized === 'MET' ? 'MET Malaysia (MET)' : 'The Weather Channel (TWC)';
      showToast(`Source: ${sourceName}`, 'info');
    }

    /**

     */
    function switchLocation(newLoc) {
      if (AppState.activeLocation === newLoc) return;
      if (!LOCATIONS[newLoc]) return;
      AppState.activeLocation = newLoc;

      if (DOM.locationSelect) DOM.locationSelect.value = newLoc;

      renderDashboard();

    /**
     * Update the "Next Pull in:" label. Shown as hours + minutes (no seconds)
     */
    function updateCountdownText() {
      const remainingMs = Math.max(0, AppState.nextSyncTime - Date.now());
      const hours = Math.floor(remainingMs / (1000 * 60 * 60));
      const mins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
      const parts = [];
      if (hours > 0) parts.push(`${hours}h`);
      if (mins > 0) parts.push(`${mins}m`);
      const formatted = parts.join(' ') || '0m';
      if (DOM.footerSyncText) DOM.footerSyncText.textContent = formatted;
    }

    /**
     * Single self-scheduling countdown
     */
    function scheduleCountdown() {
      if (AppState.countdownHandle) {
        clearTimeout(AppState.countdownHandle);
        AppState.countdownHandle = null;
      }

      if (AppState.nextSyncTime - Date.now() <= 0 && !AppState.isFetching) {
        fetchWeatherFromSources();
        return;
      }

      updateCountdownText();

      const msToNextMinute = 60000 - (Date.now() % 60000);
      const remaining = Math.max(0, AppState.nextSyncTime - Date.now());
      const delay = Math.max(1000, Math.min(remaining, msToNextMinute));
      AppState.countdownHandle = setTimeout(scheduleCountdown, delay);
    }

    /**
     * Setup Auto-Pull Schedule
     */
    function setupPullSchedule(intervalMs) {
      AppState.pullIntervalMs = intervalMs;
      AppState.nextSyncTime = Date.now() + intervalMs;
      syncIntervalSeg();
      scheduleCountdown();
    }

    /**
     * Apply (and persist) the light/dark theme.
     */
    function applyTheme(theme) {
      const next = theme === 'dark' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      syncThemeSeg();
      try {
        localStorage.setItem('met_theme', next);
      } catch (e) {}
    }

    /**
     * Floating Tooltip Manager for Overflowing Forecast Row Items
     */
    function showForecastTooltip(targetEl, text) {
      if (!DOM.weatherTooltip || !targetEl || !text) return;
      DOM.weatherTooltip.textContent = text;
      DOM.weatherTooltip.setAttribute('aria-hidden', 'false');
      DOM.weatherTooltip.classList.add('visible');

      const targetRect = targetEl.getBoundingClientRect();
      const tipRect = DOM.weatherTooltip.getBoundingClientRect();

      let left = targetRect.left + (targetRect.width - tipRect.width) / 2;
      const padding = 8;
      if (left < padding) left = padding;
      if (left + tipRect.width > window.innerWidth - padding) {
        left = window.innerWidth - tipRect.width - padding;
      }

      let top = targetRect.top - tipRect.height - 6;
      if (top < padding) {
        top = targetRect.bottom + 6;
      }

      DOM.weatherTooltip.style.left = `${Math.round(left)}px`;
      DOM.weatherTooltip.style.top = `${Math.round(top)}px`;
    }

    function hideForecastTooltip() {
      if (!DOM.weatherTooltip) return;
      DOM.weatherTooltip.classList.remove('visible');
      DOM.weatherTooltip.setAttribute('aria-hidden', 'true');
    }

    function initForecastTooltipListeners() {
      if (!DOM.monitorVerticalList) return;

      DOM.monitorVerticalList.addEventListener('mouseover', (e) => {
        const row = e.target.closest('.monitor-row-item.twc-row') || e.target.closest('.monitor-row-item');
        if (!row) {
          hideForecastTooltip();
          return;
        }

        const chip = row.querySelector('.monitor-status-chip');
        if (!chip) return;

        const isChipOverflow = chip.scrollWidth > (chip.clientWidth + 1);
        const isRowOverflow = row.scrollWidth > (row.clientWidth + 1);

        if (isChipOverflow || isRowOverflow) {
          const desc = chip.getAttribute('data-desc') || chip.textContent || '';
          if (desc) {
            showForecastTooltip(chip, desc);
          }
        } else {
          hideForecastTooltip();
        }
      });

      DOM.monitorVerticalList.addEventListener('mouseout', (e) => {
        const row = e.target.closest('.monitor-row-item.twc-row') || e.target.closest('.monitor-row-item');
        if (row) {
          const related = e.relatedTarget;
          if (!related || !row.contains(related)) {
            hideForecastTooltip();
          }
        } else {
          hideForecastTooltip();
        }
      });

      window.addEventListener('scroll', hideForecastTooltip, { passive: true });
      window.addEventListener('resize', hideForecastTooltip, { passive: true });
    }

    /**
     * =========================================================================
     * MONTHLY CALENDAR CONTROLLER (Time.is Look and Feel)
     * =========================================================================
     */
    const CalendarState = {
      currentDate: new Date(),
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth(), // 0-indexed (0 = Jan, 11 = Dec)
      selectedDateStr: null,
      midnightTimerId: null,
      lastUpdatedDateKey: null
    };

    const CALENDAR_MONTHS = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    function getTodayDateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    /**
     * Compute ISO 8601 week number matching time.is standard
     */
    function getISOWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    /**
     * Schedule a one-time timeout targeted at 12:00:00 AM (midnight).
     * Strictly runs once a day at 12am.
     */
    function scheduleMidnightCalendarUpdate() {
      if (CalendarState.midnightTimerId) {
        clearTimeout(CalendarState.midnightTimerId);
        CalendarState.midnightTimerId = null;
      }

      const now = new Date();
      // Calculate target: tomorrow at 00:00:00.050 (12:00:00.050 AM)
      const tomorrowMidnight = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + 1,
        0, 0, 0, 50
      );
      const msUntilMidnight = Math.max(1000, tomorrowMidnight.getTime() - now.getTime());

      CalendarState.midnightTimerId = setTimeout(() => {
        handleMidnightRollover();
        // After executing at 12am, schedule for the next day's 12am
        scheduleMidnightCalendarUpdate();
      }, msUntilMidnight);
    }

    /**
     * Midnight rollover handler:
     * - Auto updates the current date and re-highlights today's date
     * - Guarantees execution only once a day
     */
    function handleMidnightRollover() {
      const now = new Date();
      const todayKey = getTodayDateKey(now);

      // Enforce: only do it once a day
      if (CalendarState.lastUpdatedDateKey === todayKey) {
        return;
      }

      const prevYear = CalendarState.currentDate.getFullYear();
      const prevMonth = CalendarState.currentDate.getMonth();
      const wasViewingCurrentMonth = (CalendarState.viewYear === prevYear && CalendarState.viewMonth === prevMonth);

      CalendarState.currentDate = now;
      CalendarState.lastUpdatedDateKey = todayKey;

      // If user was viewing the current month, keep them aligned if month rolled over (e.g. Nov 30 -> Dec 1)
      if (wasViewingCurrentMonth) {
        CalendarState.viewYear = now.getFullYear();
        CalendarState.viewMonth = now.getMonth();
      }

      // Re-render calendar with new today highlight
      renderCalendar();

      // Also refresh header badge text if present
      if (DOM.headerDateText) {
        DOM.headerDateText.textContent = formatTodayHeader();
      }
    }

    /**
     * Switch view month (left = -1 for previous month, right = +1 for next month)
     */
    function changeCalendarMonth(delta) {
      CalendarState.viewMonth += delta;
      if (CalendarState.viewMonth < 0) {
        CalendarState.viewMonth = 11;
        CalendarState.viewYear -= 1;
      } else if (CalendarState.viewMonth > 11) {
        CalendarState.viewMonth = 0;
        CalendarState.viewYear += 1;
      }
      renderCalendar();
    }

    /**
     * Return to current month and year
     */
    function goToTodayCalendar() {
      const now = CalendarState.currentDate;
      CalendarState.viewYear = now.getFullYear();
      CalendarState.viewMonth = now.getMonth();
      CalendarState.selectedDateStr = getTodayDateKey(now);
      renderCalendar();
    }

    /**
     * Render Calendar View with time.is look and feel
     */
    function renderCalendar() {
      if (!DOM.calendarWrapper) return;

      const viewYear = CalendarState.viewYear;
      const viewMonth = CalendarState.viewMonth;
      const currentDate = CalendarState.currentDate;

      // 1. Update Day, Month and Year in top-left item
      if (DOM.calDayNum) {
        DOM.calDayNum.textContent = currentDate.getDate();
      }
      if (DOM.calMonthName) {
        DOM.calMonthName.textContent = CALENDAR_MONTHS[viewMonth];
      }
      if (DOM.calYearNum) {
        DOM.calYearNum.textContent = viewYear;
      }

      const firstDayOfMonth = new Date(viewYear, viewMonth, 1);
      const firstDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7; // 0=Mon, 6=Sun
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      const todayYear = currentDate.getFullYear();
      const todayMonth = currentDate.getMonth();
      const todayDate = currentDate.getDate();

      const isCurrentMonthView = (viewYear === todayYear && viewMonth === todayMonth);
      const isPastMonthView = (viewYear < todayYear || (viewYear === todayYear && viewMonth < todayMonth));

      // Build table with time.is signature markup
      let tableHtml = `<table class="caln" aria-label="Calendar for ${CALENDAR_MONTHS[viewMonth]} ${viewYear}">
        <thead>
          <tr class="dayheaders">
            <th class="wn" title="Week number"></th>
            <th title="Monday"><div>M</div></th>
            <th title="Tuesday"><div>T</div></th>
            <th title="Wednesday"><div>W</div></th>
            <th title="Thursday"><div>T</div></th>
            <th title="Friday"><div>F</div></th>
            <th title="Saturday" class="d6"><div>S</div></th>
            <th title="Sunday" class="d0"><div>S</div></th>
          </tr>
        </thead>
        <tbody>`;

      let currentDay = 1;
      while (currentDay <= daysInMonth) {
        let rowCells = [];
        let thursDay = null;

        for (let col = 0; col < 7; col++) {
          if ((currentDay === 1 && col < firstDayOfWeek) || currentDay > daysInMonth) {
            rowCells.push({ empty: true });
          } else {
            if (col === 3) thursDay = currentDay;
            const cellDate = new Date(viewYear, viewMonth, currentDay);
            const dayOfWeek = cellDate.getDay(); // 0=Sun, 6=Sat
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            let isToday = false;
            let isPast = false;

            if (isCurrentMonthView) {
              if (currentDay === todayDate) {
                isToday = true;
              } else if (currentDay < todayDate) {
                isPast = true;
              }
            } else if (isPastMonthView) {
              isPast = true;
            }

            const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(currentDay).padStart(2, '0')}`;
            const isChosen = (CalendarState.selectedDateStr === dateStr);

            rowCells.push({
              empty: false,
              day: currentDay,
              dayOfWeek,
              isWeekend,
              isToday,
              isPast,
              isChosen,
              dateStr
            });
            currentDay++;
          }
        }

        // Determine reference day for ISO week number
        const refDay = thursDay || (rowCells[6].day ? rowCells[6].day : (rowCells.find(c => !c.empty)?.day || 1));
        const weekNum = getISOWeekNumber(new Date(viewYear, viewMonth, refDay));

        tableHtml += `\n    <tr>\n      <td class="wn" title="Week ${weekNum}"><span>${weekNum}</span></td>`;
        for (const cell of rowCells) {
          if (cell.empty) {
            tableHtml += `<td class="empty-day">&nbsp;</td>`;
          } else {
            const classes = [
              'd' + cell.dayOfWeek,
              cell.isWeekend ? 'weekend' : '',
              cell.isToday ? 'today' : '',
              cell.isPast ? 'past' : '',
              cell.isChosen ? 'chosen' : ''
            ].filter(Boolean).join(' ');

            const divClass = cell.day < 10 ? 'day1to9' : '';
            const ariaLabel = `${CALENDAR_MONTHS[viewMonth]} ${cell.day}, ${viewYear}${cell.isToday ? ' (Today)' : ''}`;

            tableHtml += `<td class="${classes}" data-date="${cell.dateStr}" tabindex="0" role="gridcell" aria-label="${ariaLabel}"><div class="${divClass}"><span>${cell.day}</span></div></td>`;
          }
        }
        tableHtml += `\n    </tr>`;
      }

      tableHtml += `\n  </tbody>\n</table>`;
      DOM.calendarWrapper.innerHTML = tableHtml;

      // Bind day click listeners
      const dayCells = DOM.calendarWrapper.querySelectorAll('td[data-date]');
      dayCells.forEach(cell => {
        cell.addEventListener('click', () => {
          const clickedDateStr = cell.dataset.date;
          if (CalendarState.selectedDateStr === clickedDateStr) {
            CalendarState.selectedDateStr = null;
          } else {
            CalendarState.selectedDateStr = clickedDateStr;
          }
          renderCalendar();
        });
      });
    }

    /**
     * Bind Calendar Navigation & Keyboard Events
     */
    function bindCalendarEvents() {
      if (DOM.calPrevMonthBtn) {
        DOM.calPrevMonthBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          changeCalendarMonth(-1);
        });
      }

      if (DOM.calNextMonthBtn) {
        DOM.calNextMonthBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          changeCalendarMonth(1);
        });
      }

      if (DOM.calDayNum) {
        DOM.calDayNum.addEventListener('click', (e) => {
          e.stopPropagation();
          goToTodayCalendar();
        });
      }

      if (DOM.calendarCard) {
        DOM.calendarCard.addEventListener('keydown', (e) => {
          if (e.target.closest('input, select, textarea')) return;
          if (e.key === 'ArrowLeft') {
            changeCalendarMonth(-1);
          } else if (e.key === 'ArrowRight') {
            changeCalendarMonth(1);
          }
        });
      }

      // Check date on tab wake up (if tab was in sleep mode over 12 AM)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          const now = new Date();
          const todayKey = getTodayDateKey(now);
          if (CalendarState.lastUpdatedDateKey !== todayKey) {
            handleMidnightRollover();
            scheduleMidnightCalendarUpdate();
          }
        }
      });
    }

    function initCalendar() {
      const now = new Date();
      CalendarState.currentDate = now;
      CalendarState.viewYear = now.getFullYear();
      CalendarState.viewMonth = now.getMonth();
      CalendarState.lastUpdatedDateKey = getTodayDateKey(now);

      renderCalendar();
      bindCalendarEvents();
      scheduleMidnightCalendarUpdate();
    }

    /**
     * Initialize Application
     */
    document.addEventListener('DOMContentLoaded', () => {
      initDOMCache();
      cleanupLegacyStorage();
      applyTheme(localStorage.getItem('met_theme') || 'light');
      renderDashboard();
      initForecastTooltipListeners();

      DOM.locationSelect.addEventListener('change', (e) => {
        switchLocation(e.target.value);
      });

      if (DOM.sourceBtnTWC) {
        DOM.sourceBtnTWC.addEventListener('click', () => {
          switchSource('TWC');
        });
      }
      if (DOM.sourceBtnMET) {
        DOM.sourceBtnMET.addEventListener('click', () => {
          switchSource('MET');
        });
      }

      if (DOM.refreshBtn) {
        DOM.refreshBtn.addEventListener('click', () => {
          fetchWeatherFromSources();
        });
      }

      // Settings popover — Theme & Interval controls
      if (DOM.settingsBtn) {
        DOM.settingsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSettings();
        });
      }
      if (DOM.segTheme) {
        DOM.segTheme.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-theme]');
          if (!btn) return;
          e.stopPropagation();
          const selectedTheme = btn.dataset.theme;
          applyTheme(selectedTheme);
          showToast(`Theme: ${selectedTheme === 'dark' ? 'Dark' : 'Light'}`, 'info');
        });
      }
      if (DOM.segInterval) {
        DOM.segInterval.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-ms]');
          if (!btn) return;
          e.stopPropagation();
          const intervalMs = parseInt(btn.dataset.ms, 10);
          setupPullSchedule(intervalMs);
          syncIntervalSeg();
          showToast(`Interval: ${btn.textContent}`, 'info');
          closeSettings();
        });
      }
      if (DOM.settingsPopover) {
        DOM.settingsPopover.addEventListener('click', (e) => e.stopPropagation());
      }
      if (DOM.warningToggleBtn) {
        DOM.warningToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWarningPopover();
        });
      }
      if (DOM.warningPopover) {
        DOM.warningPopover.addEventListener('click', (e) => e.stopPropagation());
      }
      document.addEventListener('click', () => {
        closeSettings();
        closeWarningPopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeSettings();
          closeWarningPopover();
        }
      });

      syncThemeSeg();
      syncIntervalSeg();
      setupPullSchedule(3600000); // 60 mins default

      fetchWeatherFromSources();
      initCalendar();
    });
  </script>
